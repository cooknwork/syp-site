name: Build preview

# Every push to main is built here. The result (or the build log, if it failed)
# is pushed to the `preview` branch, where it can be published as a test link.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund 2>&1 | tee install.log

      - name: Type check
        id: typecheck
        run: set -o pipefail; npx tsc --noEmit 2>&1 | tee typecheck.log

      - name: Build
        id: build
        run: set -o pipefail; npm run build 2>&1 | tee build.log

      - name: Make paths relative
        run: node scripts/prepare-preview.mjs out

      - name: Publish to preview branch
        if: always()
        run: |
          set -e
          mkdir -p /tmp/preview
          if [ -d out ]; then cp -r out/. /tmp/preview/; fi
          for f in install.log typecheck.log build.log; do [ -f "$f" ] && cp "$f" /tmp/preview/ || true; done
          {
            echo "commit: $GITHUB_SHA"
            echo "typecheck: ${{ steps.typecheck.outcome }}"
            echo "build: ${{ steps.build.outcome }}"
            echo "time: $(date -u +%FT%TZ)"
          } > /tmp/preview/STATUS.txt
          cd /tmp/preview
          git init -q -b preview
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "preview for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" preview
