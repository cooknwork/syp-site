name: Check domain

# Manual check of the site's domain: DNS records, HTTPS and what the site answers.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain
        default: soup.moscow

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS and HTTPS
        env:
          D: ${{ inputs.domain }}
        run: |
          sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
          echo "== NS";          dig +short NS "$D"
          echo "== A $D";        dig +short A "$D"
          echo "== AAAA $D";     dig +short AAAA "$D"
          echo "== CNAME www";   dig +short CNAME "www.$D"
          echo "== A www";       dig +short A "www.$D"
          echo "== TXT _github-pages-challenge-cooknwork"; dig +short TXT "_github-pages-challenge-cooknwork.$D"
          echo "== http://$D";   curl -sS -o /dev/null -m 20 -w "%{http_code} -> %{redirect_url}\n" "http://$D/" || true
          echo "== https://$D";  curl -sS -o /dev/null -m 20 -w "%{http_code} -> %{redirect_url}\n" "https://$D/" || true
          echo "== https://www.$D"; curl -sS -o /dev/null -m 20 -w "%{http_code} -> %{redirect_url}\n" "https://www.$D/" || true
          echo "== /admin/";    curl -sS -o /dev/null -m 20 -w "%{http_code}\n" "https://$D/admin/" || true
          echo "== asset";      a=$(curl -sS -m 20 "https://$D/" | grep -o '/_next/static/[^"]*\.js' | head -1); echo "$a"; curl -sS -o /dev/null -m 20 -w "%{http_code}\n" "https://$D$a" || true
          echo "== old address"; curl -sS -o /dev/null -m 20 -w "%{http_code} -> %{redirect_url}\n" "https://cooknwork.github.io/syp-site/" || true
          echo "== cert";       echo | openssl s_client -servername "$D" -connect "$D:443" 2>/dev/null | openssl x509 -noout -issuer -enddate || true
          echo "== CAA";        dig +short CAA "$D"; dig +short CAA moscow
          echo "== cert names $D";   echo | openssl s_client -servername "$D" -connect "$D:443" 2>/dev/null | openssl x509 -noout -ext subjectAltName -startdate || true
          echo "== cert names www";  echo | openssl s_client -servername "www.$D" -connect "www.$D:443" 2>/dev/null | openssl x509 -noout -ext subjectAltName -startdate || true
          echo "== title";       curl -sS -m 20 -L "https://$D/" 2>/dev/null | grep -o '<title>[^<]*</title>' | head -1 || true
