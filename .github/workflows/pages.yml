name: Deploy to GitHub Pages

# Every push to main is published at https://cooknwork.github.io/syp-site/
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Hourly rebuild: picks up «Общие настройки» (title, description, social preview, favicon) and keeps the
  # first paint fresh. Regular content does not need it — the site re-reads the database in the browser.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Asks GitHub where the site lives: /syp-site on cooknwork.github.io, or the root of a custom domain.
      # So moving to a purchased domain needs no code change.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
